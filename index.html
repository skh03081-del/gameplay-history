<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMEPLAY ARCHIVE | JYLEE LOG</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --pc-neon: #00f3ff;
            --mobile-neon: #39ff14;
            --console-neon: #ff00ff;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Rajdhani', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050505 100%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 100%, 100% 4px, 3px 100%;
            color: #fff;
            padding: 50px 20px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 80px;
            text-transform: uppercase;
        }
        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            letter-spacing: 8px;
            color: #fff;
            text-shadow: 0 0 10px var(--pc-neon), 0 0 20px var(--pc-neon);
            margin-bottom: 10px;
        }
        header p { color: #888; letter-spacing: 2px; font-weight: bold; }

        .container { max-width: 1300px; margin: 0 auto; }

        .section-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            margin: 80px 0 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, currentColor, transparent);
        }

        .pc-label { color: var(--pc-neon); }
        .mobile-label { color: var(--mobile-neon); }
        .console-label { color: var(--console-neon); }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .card {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            clip-path: polygon(0 0, 90% 0, 100% 15%, 100% 100%, 10% 100%, 0 85%);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        .card:hover {
            transform: scale(1.05) rotateX(5deg);
            border-color: currentColor;
            box-shadow: 0 0 20px currentColor;
            z-index: 10;
        }

        .img-box {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        .card:hover .img-box img { opacity: 1; }

        .info-box {
            padding: 20px;
            background: rgba(0,0,0,0.6);
        }

        .info-box h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
        }

        .playtime { font-size: 0.9rem; color: #fff; }
        .status-dot {
            width: 8px; height: 8px;
            background: currentColor;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        @media (max-width: 1024px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>

    </header>

    <div class="section-label pc-label">01 // PC_PLATFORM</div>
    <div class="grid" id="pc-grid"></div>

    <div class="section-label mobile-label">02 // MOBILE_ENVIRONMENT</div>
    <div class="grid" id="mobile-grid"></div>

    <div class="section-label console-label">03 // CONSOLE_SYSTEM</div>
    <div class="grid" id="console-grid"></div>

        if (timeStr.includes('년')) return parseInt(timeStr) * 12;

        const grid = document.getElementById(gridId);
        const sortedData = [...gameData].sort((a, b) => parseTimeToMonths(b.time) - parseTimeToMonths(a.time));

            grid.innerHTML += `
                <div class="card" style="color: ${colorVar}">
                    <div class="img-box">
                        <img src="${game.url}" alt="${game.name}" onerror="this.src='https://via.placeholder.com/400x300/111/555?text=IMAGE+ERROR';">
                    </div>
                    <div class="info-box">
                        <h3>${game.name}</h3>
                        <div class="stats">
                            <span class="playtime">${game.time} 플레이</span>
                            <div class="status-dot"></div>
                        </div>
