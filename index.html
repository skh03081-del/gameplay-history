<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMEPLAY ARCHIVE | USER LOG</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --pc-neon: #00f3ff;      /* 사이언 블루 */
            --mobile-neon: #39ff14;  /* 네온 그린 */
            --console-neon: #ff00ff; /* 마젠타 핑크 */
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Rajdhani', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050505 100%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 100%, 100% 4px, 3px 100%;
            color: #fff;
            padding: 50px 20px;
            overflow-x: hidden;
        }

        /* 헤더 디자인 */
        header {
            text-align: center;
            margin-bottom: 80px;
            text-transform: uppercase;
        }
        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            letter-spacing: 8px;
            color: #fff;
            text-shadow: 0 0 10px var(--pc-neon), 0 0 20px var(--pc-neon);
            margin-bottom: 10px;
        }
        header p { color: #888; letter-spacing: 2px; font-weight: bold; }

        .container { max-width: 1300px; margin: 0 auto; }

        /* 플랫폼 섹션 제목 */
        .section-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            margin: 60px 0 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, currentColor, transparent);
        }

        .pc-label { color: var(--pc-neon); }
        .mobile-label { color: var(--mobile-neon); }
        .console-label { color: var(--console-neon); }

        /* 게임 카드 그리드 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
        }

        /* 카드 개별 디자인 */
        .card {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            clip-path: polygon(0 0, 90% 0, 100% 15%, 100% 100%, 10% 100%, 0 85%);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        .card::before {
            content: 'SYSTEM ACTIVE';
            position: absolute;
            top: 5px; right: 20px;
            font-size: 0.6rem;
            opacity: 0.3;
        }

        .card:hover {
            transform: scale(1.05) rotateX(5deg);
            border-color: currentColor;
            box-shadow: 0 0 20px currentColor;
        }

        .img-box {
            width: 100%;
            height: 250px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        /* 스캔라인 효과 */
        .img-box::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        .info-box {
            padding: 20px;
            background: rgba(0,0,0,0.6);
        }

        .info-box h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
        }

        .playtime { font-size: 0.9rem; color: #fff; }
        .status-dot {
            width: 8px; height: 8px;
            background: currentColor;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            header h1 { font-size: 2rem; }
            .grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>PLAYER_DATA</h1>
        <p>Operational Intelligence & Gameplay History</p>
    </header>

    <div class="section-label pc-label">01 // PC_PLATFORM</div>
    <div class="grid" id="pc-grid"></div>

    <div class="section-label mobile-label">02 // MOBILE_ENVIRONMENT</div>
    <div class="grid" id="mobile-grid"></div>

    <div class="section-label console-label">03 // CONSOLE_SYSTEM</div>
    <div class="grid" id="console-grid"></div>
</div>

<script>
    const createCards = (gridId, games, time, colorClass) => {
        const grid = document.getElementById(gridId);
        games.forEach(name => {
            grid.innerHTML += `
                <div class="card" style="color: ${colorClass}">
                    <div class="img-box">
                        <span style="opacity:0.2">[ NO_IMAGE ]</span>
                    </div>
                    <div class="info-box">
                        <h3>${name}</h3>
                        <div class="stats">
                            <span class="playtime">${time}</span>
                            <div class="status-dot"></div>
                        </div>
                    </div>
                </div>
            `;
        });
    };

    // 데이터 삽입 (원하는 게임명으로 변경하세요)
    createCards('pc-grid', ["FC Online", "PUBG", "Valorant", "League of Legends", "Overwatch 2", "Lost Ark"], "1,200H+", "var(--pc-neon)");
    createCards('mobile-grid', ["Genshin", "Brawl Stars", "Nikke", "Blue Archive", "Wild Rift", "Cookie Run"], "600H+", "var(--mobile-neon)");
    createCards('console-grid', ["Elden Ring", "Zelda: TotK", "God of War", "Spiderman 2", "Monster Hunter", "FF7 Rebirth"], "300H+", "var(--console-neon)");
</script>

</body>
</html>
