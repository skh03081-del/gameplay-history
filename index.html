<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMEPLAY ARCHIVE | JYLEE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Image 0 기반의 전문적인 다크 모드 스타일 */
        :root {
            --bg-color: #0d1117;     /* 짙은 배경 */
            --card-bg: #161b22;      /* 카드 배경 */
            --text-main: #e6edf3;    /* 연한 회색 텍스트 */
            --text-sub: #8b949e;     /* 더 옅은 회색 */
            --accent-cyan: #58a6ff;  /* 전문적인 시안색 포인트 */
            --border-color: #30363d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 80px 20px;
        }

        .container { max-width: 1300px; margin: 0 auto; }

        /* 헤더 디자인 (Image 0 스타일 적용) */
        header {
            text-align: center;
            margin-bottom: 100px;
            padding-bottom: 50px;
            border-bottom: 1px solid var(--border-color);
        }
        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -2px;
            margin-bottom: 20px;
        }
        header p {
            font-size: 1.3rem;
            color: var(--text-sub);
            max-width: 600px;
            margin: 0 auto;
        }

        /* 플랫폼 섹션 제목 */
        .section-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: var(--accent-cyan);
            margin: 80px 0 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border-color), transparent);
        }

        /* 그리드 설정: 한 줄에 4개 */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        /* 카드 디자인 */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-cyan);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* [핵심] 시네마틱 이미지 컨테이너: 절대 안 짤림 */
        .img-box {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3; /* 카드 비율 고정 */
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 배경 블러 이미지 (빈 공간 채우기용) */
        .img-blur-bg {
            position: absolute;
            width: 120%;
            height: 120%;
            object-fit: cover; /* 배경은 채워야 함 */
            filter: blur(15px) brightness(0.4); /* 소프트한 블러 및 어둡게 처리 */
            z-index: 1;
        }

        /* 메인 이미지 (전체 노출) */
        .img-main {
            position: relative;
            z-index: 2;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* [중요] 절대 잘리지 않고 전체 다 보여줌 */
            transition: transform 0.3s ease;
        }
        .card:hover .img-main { transform: scale(1.05); }

        /* 정보 영역 */
        .info-box {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .info-box h3 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 플레이 기간 (Image 0 스타일 대괄호) */
        .time {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        /* [수정] 장르 노출 (Image 0 스타일 시안색 포인트) */
        .genre {
            font-size: 0.9rem;
            color: var(--accent-cyan);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media (max-width: 1024px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } header h1 { font-size: 2.5rem; } }
    </style>
</head>
<body>

        <p>기획자의 시선으로 분석한 장르별 플레이 이력 및 데이터베이스</p>
    </header>

    <div class="section-label">01. PC_PLATFORM</div>
    <div id="pc-grid" class="grid"></div>

    <div class="section-label">02. MOBILE_ENVIRONMENT</div>

    <div class="section-label">03. CONSOLE_SYSTEM</div>

        sorted.forEach(g => {
            grid.innerHTML += `
                <div class="card">
                    <div class="img-box">
                        <img src="${g.url}" class="img-blur-bg">
                        <img src="${g.url}" alt="${g.name}" class="img-main" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300/111/333?text=IMAGE+ERROR';">
                    </div>
                    <div class="info-box">
                        <h3>${g.name}</h3>
                        <div class="stats">
                            <span class="time">[ ${g.time} ]</span>
                            <span class="genre">${g.genre}</span>
