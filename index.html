<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameplay History | Game Planner Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8; /* 포인트 컬러: 스카이 블루 */
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --pc-color: #ef4444;    /* PC 섹션 포인트 */
            --mobile-color: #22c55e; /* Mobile 섹션 포인트 */
            --console-color: #a855f7; /* Console 섹션 포인트 */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeIn 1s ease-in;
        }

        header h1 { font-size: 2.5rem; margin-bottom: 10px; letter-spacing: -1px; }
        header p { color: var(--text-sub); font-size: 1.1rem; }

        .container { max-width: 1200px; margin: 0 auto; }

        /* 섹션 타이틀 스타일 */
        .section-title {
            display: flex;
            align-items: center;
            margin: 40px 0 20px;
            font-size: 1.8rem;
            border-left: 5px solid var(--accent-color);
            padding-left: 15px;
        }
        .pc-title { border-color: var(--pc-color); }
        .mobile-title { border-color: var(--mobile-color); }
        .console-title { border-color: var(--console-color); }

        /* 그리드 레이아웃 */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
        }

        /* 게임 카드 스타일 */
        .game-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .game-img {
            width: 100%;
            aspect-ratio: 3 / 4;
            background: #334155; /* 이미지 없을 때 기본 배경 */
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            font-size: 0.9rem;
            object-fit: cover;
        }

        .game-info {
            padding: 15px;
        }

        .game-info h4 {
            font-size: 1.05rem;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .play-time {
            font-size: 0.85rem;
            color: var(--accent-color);
            font-weight: bold;
        }

        /* 애니메이션 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 반응형 설정 */
        @media (max-width: 768px) {
            .game-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>GAMEPLAY ARCHIVE</h1>
        <p>게임 기획자로서의 인사이트를 쌓아온 플레이 기록입니다.</p>
    </header>

    <h2 class="section-title pc-title">PC Platform</h2>
    <div class="game-grid" id="pc-grid">
        <script>
            const pcGames = ["FC Online", "PUBG", "League of Legends", "Valorant", "Overwatch 2", "Lost Ark"];
            const pcGrid = document.getElementById('pc-grid');
            pcGames.forEach(name => {
                pcGrid.innerHTML += `
                    <div class="game-card">
                        <div class="game-img">IMG</div>
                        <div class="game-info">
                            <h4>${name}</h4>
                            <p class="play-time">1,500+ Hours</p>
                        </div>
                    </div>
                `;
            });
        </script>
    </div>

    <h2 class="section-title mobile-title">Mobile Platform</h2>
    <div class="game-grid" id="mobile-grid">
        <script>
            const mobileGames = ["Genshin Impact", "Brawl Stars", "Cookie Run", "Blue Archive", "Nikke", "Wild Rift"];
            const mobileGrid = document.getElementById('mobile-grid');
            mobileGames.forEach(name => {
                mobileGrid.innerHTML += `
                    <div class="game-card">
                        <div class="game-img">IMG</div>
                        <div class="game-info">
                            <h4>${name}</h4>
                            <p class="play-time">500+ Hours</p>
                        </div>
                    </div>
                `;
            });
        </script>
    </div>

    <h2 class="section-title console-title">Console Platform</h2>
    <div class="game-grid" id="console-grid">
        <script>
            const consoleGames = ["Elden Ring", "God of War", "Zelda: TotK", "Spider-Man 2", "Monster Hunter", "FF7 Rebirth"];
            const consoleGrid = document.getElementById('console-grid');
            consoleGames.forEach(name => {
                consoleGrid.innerHTML += `
                    <div class="game-card">
                        <div class="game-img">IMG</div>
                        <div class="game-info">
                            <h4>${name}</h4>
                            <p class="play-time">200+ Hours</p>
                        </div>
                    </div>
                `;
            });
        </script>
    </div>
</div>

</body>
</html>
