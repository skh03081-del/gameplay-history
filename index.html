<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEE JAE YOUNG // GAME PLAY LIST</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@400;600;800&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151921;
            --text-main: #f0f3f6;
            --text-sub: #9099a3;
            --pc-cyan: #4fc3f7;
            --mobile-green: #81c784;
            --console-purple: #b39ddb;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 60px 20px;
        }

        .container { max-width: 1300px; margin: 0 auto; }

        /* [Header] 요청하신 여백 수정 및 텍스트 강조 */
        header {
            text-align: center;
            padding: 20px 0 40px; /* 위아래 여백을 동일하고 타이트하게 조정 */
            border-bottom: 1px solid var(--border);
            margin-bottom: 50px; /* 섹션과의 간격을 최적화 */
        }
        header .name-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            color: var(--text-sub);
            letter-spacing: 10px;
            margin-bottom: 8px;
            display: block;
        }
        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4.2rem;
            font-weight: 900;
            letter-spacing: -2px;
            color: #fff;
            text-shadow: 0 0 20px rgba(79, 195, 247, 0.2);
        }

        /* [Section Header] 현대적인 버튼형 디자인 */
        .section-header {
            margin: 60px 0 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .section-header .tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            padding: 8px 25px;
            background: rgba(255, 255, 255, 0.03);
            border-left: 5px solid currentColor;
            border-radius: 4px;
        }
        .section-header .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, currentColor, transparent);
            opacity: 0.3;
        }

        .pc-theme { color: var(--pc-cyan); }
        .mobile-theme { color: var(--mobile-green); }
        .console-theme { color: var(--console-purple); }

        /* 그리드 */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        /* 카드 디자인 */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-8px);
            border-color: currentColor;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
        }

        /* [Image Box] 짤림 방지 + 자연스러운 블러 캔버스 */
        .img-box {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .img-blur {
            position: absolute;
            width: 120%;
            height: 120%;
            object-fit: cover;
            filter: blur(15px) brightness(0.3);
            z-index: 1;
        }
        .img-main {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            object-fit: contain; /* 사진 전체를 보여줌 */
            padding: 5px;
        }

        /* 정보 영역 */
        .info-box {
            padding: 20px;
        }
        .info-box h3 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 숫자 전용 Poppins 폰트로 가독성 극대화 */
        .time-badge {
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.08);
            padding: 3px 12px;
            border-radius: 6px;
            color: var(--text-main);
        }
        .genre-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            color: currentColor;
            text-transform: uppercase;
        }

        @media (max-width: 1024px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } header h1 { font-size: 2.8rem; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <span class="name-tag">LEE JAE YOUNG</span>
        <h1>GAME PLAY LIST</h1>
    </header>

    <div class="section-header pc-theme">
        <div class="tag">01. PC</div>
        <div class="line"></div>
    </div>
    <div id="pc-grid" class="grid"></div>

    <div class="section-header mobile-theme">
        <div class="tag">02. MOBILE</div>
        <div class="line"></div>
    </div>
    <div id="mobile-grid" class="grid"></div>

    <div class="section-header console-theme">
        <div class="tag">03. CONSOLE</div>
        <div class="line"></div>
    </div>
    <div id="console-grid" class="grid"></div>
</div>

<script>
    const parseTime = (t) => t.includes('년') ? parseInt(t) * 12 : parseInt(t);

    const render = (id, data, color) => {
        const grid = document.getElementById(id);
        const sorted = [...data].sort((a, b) => parseTime(b.time) - parseTime(a.time));
        
        sorted.forEach(g => {
            grid.innerHTML += `
                <div class="card" style="color: ${color}">
                    <div class="img-box">
                        <img src="${g.img}.jpg" class="img-blur">
                        <img src="${g.img}.jpg" class="img-main" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300/111/333?text=IMAGE+MISSING';">
                    </div>
                    <div class="info-box">
                        <h3>${g.name}</h3>
                        <div class="stats">
                            <span class="time-badge">${g.time}</span>
                            <span class="genre-badge">${g.genre}</span>
                        </div>
                    </div>
                </div>`;
        });
    };

    // [PC 데이터 20종]
    const pcGames = [

        {name: "메이플스토리", time: "8년", img: "maple", genre: "MMORPG"},

        {name: "마구마구", time: "3년", img: "magu", genre: "Sports"},
        {name: "메이플스토리2", time: "2년", img: "maple2", genre: "MMORPG"},
        {name: "에이펙스 레전드", time: "1년", img: "apex", genre: "FPS"},
        {name: "철권 8", time: "1년", img: "tekken8", genre: "Fighting"},
        {name: "어몽어스", time: "1년", img: "among-us", genre: "Social"},
        {name: "구스구스덕", time: "1년", img: "goose-duck", genre: "Social"},

    // [MOBILE 데이터 16종]
    const mobileGames = [
        {name: "컴투스프로야구", time: "8년", img: "com2us", genre: "Sports"},
        {name: "전략적 팀 전투", time: "5년", img: "tft", genre: "Auto Battler"},

    // [CONSOLE 데이터 12종]
    const consoleGames = [
        {name: "FIFA 시리즈", time: "10년", img: "fifa", genre: "Sports"},

        {name: "인피니도트2", time: "3개월", img: "infinitode2", genre: "Tower Defense"}

    document.addEventListener('DOMContentLoaded', () => {
        render('pc-grid', pcGames, "var(--pc-cyan)");
        render('mobile-grid', mobileGames, "var(--mobile-green)");

</script>
</body>
</html>
