<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMEPLAY ARCHIVE | JYLEE LOG</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --pc-neon: #00f3ff;
            --mobile-neon: #39ff14;
            --console-neon: #ff00ff;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Rajdhani', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050505 100%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 100%, 100% 4px, 3px 100%;
            color: #fff;
            padding: 50px 20px;
        }

        .container { max-width: 1300px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 60px; text-transform: uppercase; }
        header h1 { font-family: 'Orbitron', sans-serif; font-size: 3rem; letter-spacing: 8px; text-shadow: 0 0 10px var(--pc-neon); }

        .section-label { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; margin: 60px 0 30px; display: flex; align-items: center; gap: 15px; }
        .section-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, currentColor, transparent); }
        .pc-label { color: var(--pc-neon); }
        .mobile-label { color: var(--mobile-neon); }
        .console-label { color: var(--console-neon); }

        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); clip-path: polygon(0 0, 90% 0, 100% 15%, 100% 100%, 10% 100%, 0 85%); overflow: hidden; backdrop-filter: blur(5px); transition: 0.3s; }
        .card:hover { transform: scale(1.03); border-color: currentColor; box-shadow: 0 0 15px currentColor; }
        .img-box { width: 100%; aspect-ratio: 4 / 3; background: #111; position: relative; overflow: hidden; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        .info-box { padding: 15px; background: rgba(0,0,0,0.7); }
        .info-box h3 { font-family: 'Orbitron', sans-serif; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stats { display: flex; justify-content: space-between; font-size: 0.85rem; margin-top: 5px; }

        @media (max-width: 1024px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <header><h1>PLAYER_DATA</h1><p>Operational Intelligence & Gameplay History</p></header>

    <div class="section-label pc-label">01 // PC_PLATFORM</div>
    <div id="pc-grid" class="grid"></div>

    <div class="section-label mobile-label">02 // MOBILE_ENVIRONMENT</div>
    <div id="mobile-grid" class="grid"></div>

    <div class="section-label console-label">03 // CONSOLE_SYSTEM</div>
    <div id="console-grid" class="grid"></div>
</div>

<script>
    const parseTime = (t) => t.includes('년') ? parseInt(t) * 12 : parseInt(t);

    const render = (id, data, color) => {
        const grid = document.getElementById(id);
        const sorted = [...data].sort((a, b) => parseTime(b.time) - parseTime(a.time));
        
        sorted.forEach(g => {
            grid.innerHTML += `
                <div class="card" style="color: ${color}">
                    <div class="img-box">
                        <img src="${g.img}.jpg" loading="lazy" onerror="this.src='https://via.placeholder.com/500x300/111/555?text=IMAGE+MISSING';">
                    </div>
                    <div class="info-box">
                        <h3>${g.name}</h3>
                        <div class="stats"><span>${g.time} 플레이</span><div style="width:8px; height:8px; background:currentColor; border-radius:50%;"></div></div>
                    </div>
                </div>`;
        });
    };

    // 파일 이름(img)이 실제 깃허브에 올린 파일명과 대소문자까지 똑같아야 합니다.
    const pcGames = [
        {name: "FC 온라인", time: "15년", img: "fc-online"},
        {name: "스타크래프트", time: "12년", img: "starcraft"},
        {name: "리그 오브 레전드", time: "10년", img: "lol"},
        {name: "오버워치", time: "8년", img: "overwatch"},
        {name: "메이플스토리", time: "8년", img: "maple"},
        {name: "배틀그라운드", time: "7년", img: "pubg"},
        {name: "서든어택", time: "5년", img: "sudden"},
        {name: "카운터 스트라이크", time: "5년", img: "cs"},
        {name: "카트라이더", time: "5년", img: "kart"},
        {name: "크레이지아케이드", time: "5년", img: "crazy-arcade"},
        {name: "로스트아크", time: "3년", img: "lostark"},
        {name: "워록", time: "3년", img: "warrock"},
        {name: "마구마구", time: "3년", img: "magu"},
        {name: "메이플스토리2", time: "2년", img: "maple2"},
        {name: "에이펙스 레전드", time: "1년", img: "apex"},
        {name: "철권 8", time: "1년", img: "tekken8"},
        {name: "어몽어스", time: "1년", img: "among-us"},
        {name: "구스구스덕", time: "1년", img: "goose-duck"},
        {name: "크로스파이어", time: "1년", img: "crossfire"},
        {name: "아이온2", time: "6개월", img: "aion2"}
    ];

    const mobileGames = [
        {name: "컴투스프로야구", time: "8년", img: "com2us"},
        {name: "전략적 팀 전투", time: "5년", img: "tft"},
        {name: "쿠키런", time: "5년", img: "cookierun"},
        {name: "미니게임천국", time: "3년", img: "minigame"},
        {name: "PES (eFootball)", time: "3년", img: "pes"},
        {name: "모두의 마블", time: "2년", img: "modoo-marble"},
        {name: "템플런", time: "2년", img: "temple-run"},
        {name: "리듬 스타", time: "2년", img: "rhythm-star"},
        {name: "프렌즈 사천성", time: "2년", img: "sachunsung"},
        {name: "브레인 아웃", time: "1년", img: "brainout"},
        {name: "MLB 라이벌", time: "1년", img: "mlb-rival"},
        {name: "앵그리버드", time: "1년", img: "angry-birds"},
        {name: "니케", time: "6개월", img: "nikke"},
        {name: "메이플 키우기", time: "6개월", img: "maple-raise"},

    ];

    const consoleGames = [
        {name: "FIFA 시리즈", time: "10년", img: "fifa"},
        {name: "풋볼 매니저", time: "8년", img: "fm"},
        {name: "나루토 질풍전", time: "2년", img: "naruto"},
        {name: "MLB The Show", time: "1년", img: "mlb-show"},
        {name: "잇 테이크 투", time: "1년", img: "ittakestwo"},

        {name: "아크 레이더스", time: "6개월", img: "arc-raiders"},
        {name: "퍼스트 디센던트", time: "6개월", img: "first-descendant"},
        {name: "엘든 링", time: "3개월", img: "elden-ring"},
        {name: "P의 거짓", time: "3개월", img: "lies-of-p"},
        {name: "젤다의 전설", time: "3개월", img: "zelda"},
        {name: "인피니도트2", time: "3개월", img: "infinitode2"}
    ];

    document.addEventListener('DOMContentLoaded', () => {
        render('pc-grid', pcGames, "var(--pc-neon)");
        render('mobile-grid', mobileGames, "var(--mobile-neon)");
        render('console-grid', consoleGames, "var(--console-neon)");
    });
</script>
</body>
</html>
