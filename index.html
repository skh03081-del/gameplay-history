<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMEPLAY ARCHIVE | JYLEE LOG</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --pc-neon: #00f3ff;
            --mobile-neon: #39ff14;
            --console-neon: #ff00ff;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Rajdhani', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050505 100%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 100%, 100% 4px, 3px 100%;
            color: #fff;
            padding: 50px 20px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 80px;
            text-transform: uppercase;
        }
        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            letter-spacing: 8px;
            color: #fff;
            text-shadow: 0 0 10px var(--pc-neon), 0 0 20px var(--pc-neon);
            margin-bottom: 10px;
        }
        header p { color: #888; letter-spacing: 2px; font-weight: bold; }

        .container { max-width: 1300px; margin: 0 auto; }

        .section-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            margin: 80px 0 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, currentColor, transparent);
        }

        .pc-label { color: var(--pc-neon); }
        .mobile-label { color: var(--mobile-neon); }
        .console-label { color: var(--console-neon); }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .card {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            clip-path: polygon(0 0, 90% 0, 100% 15%, 100% 100%, 10% 100%, 0 85%);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            backdrop-filter: blur(5px);
        }

        .card::before {
            content: 'SYSTEM ACTIVE';
            position: absolute;
            top: 5px; right: 20px;
            font-size: 0.6rem;
            opacity: 0.3;
            z-index: 2;
        }

        .card:hover {
            transform: scale(1.05) rotateX(5deg);
            border-color: currentColor;
            box-shadow: 0 0 20px currentColor;
            z-index: 10;
        }

        .img-box {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        .card:hover .img-box img { opacity: 1; }
        
        .img-box::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        .info-box {
            padding: 20px;
            background: rgba(0,0,0,0.6);
        }

        .info-box h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
        }

        .playtime { font-size: 0.9rem; color: #fff; }
        .status-dot {
            width: 8px; height: 8px;
            background: currentColor;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        @media (max-width: 1024px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { 
            header h1 { font-size: 2rem; }
            .grid { grid-template-columns: 1fr; } 
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>PLAYER_DATA</h1>
        <p>Operational Intelligence & Gameplay History</p>
    </header>

    <div class="section-label pc-label">01 // PC_PLATFORM</div>
    <div class="grid" id="pc-grid"></div>

    <div class="section-label mobile-label">02 // MOBILE_ENVIRONMENT</div>
    <div class="grid" id="mobile-grid"></div>

    <div class="section-label console-label">03 // CONSOLE_SYSTEM</div>
    <div class="grid" id="console-grid"></div>
</div>

<script>
    // 시간 데이터를 숫자로 변환하는 함수 (정렬용)
    const parseTimeToMonths = (timeStr) => {
        if (timeStr.includes('년')) {
            return parseInt(timeStr) * 12;
        } else if (timeStr.includes('개월')) {
            return parseInt(timeStr);
        }
        return 0;
    };

    const createCards = (gridId, gameData, colorVar) => {
        const grid = document.getElementById(gridId);
        
        // 정렬 로직 적용
        const sortedData = [...gameData].sort((a, b) => 
            parseTimeToMonths(b.time) - parseTimeToMonths(a.time)
        );

        sortedData.forEach(game => {
            grid.innerHTML += `
                <div class="card" style="color: ${colorVar}">
                    <div class="img-box">
                        <img src="images/${game.img}.jpg" onerror="this.style.display='none';">
                        <span style="position:absolute; opacity:0.2; z-index:0;">[ NO_IMAGE ]</span>
                    </div>
                    <div class="info-box">
                        <h3>${game.name}</h3>
                        <div class="stats">
                            <span class="playtime">${game.time} 플레이</span>
                            <div class="status-dot"></div>
                        </div>
                    </div>
                </div>
            `;
        });
    };

    // PC 데이터 (총 20종)
    const pcGames = [

        {name: "서든어택", time: "5년", img: "sudden"},
        {name: "크로스파이어", time: "1년", img: "crossfire"},
        {name: "메이플스토리", time: "8년", img: "maple"},
        {name: "메이플스토리2", time: "2년", img: "maple2"},
        {name: "로스트아크", time: "3년", img: "lostark"},
        {name: "카운터 스트라이크", time: "5년", img: "cs"},
        {name: "에이펙스 레전드", time: "1년", img: "apex"},
        {name: "철권 8", time: "1년", img: "tekken8"},
        {name: "워록", time: "3년", img: "warrock"},
        {name: "카트라이더", time: "5년", img: "kart"},
        {name: "마구마구", time: "3년", img: "magu"},
        {name: "아이온2", time: "6개월", img: "aion2"},
        {name: "어몽어스", time: "1년", img: "among-us"},
        {name: "구스구스덕", time: "1년", img: "goose-duck"},
        {name: "크레이지아케이드", time: "5년", img: "crazy-arcade"}
    ];

    // 모바일 데이터 (총 16종)
    const mobileGames = [
        {name: "컴투스프로야구", time: "8년", img: "com2us"},
        {name: "브레인 아웃", time: "1년", img: "brainout"},

        {name: "PES (eFootball)", time: "3년", img: "pes"},

    // 콘솔 데이터 (총 12종)
    const consoleGames = [
        {name: "FIFA 시리즈", time: "10년", img: "fifa"},
        {name: "MLB The Show", time: "1년", img: "mlb-show"},
        {name: "풋볼 매니저", time: "8년", img: "fm"},

        {name: "인피니도트2", time: "3개월", img: "infinitode2"}
    ];

    createCards('pc-grid', pcGames, "var(--pc-neon)");
    createCards('mobile-grid', mobileGames, "var(--mobile-neon)");
    createCards('console-grid', consoleGames, "var(--console-neon)");
</script>

</body>
</html>
