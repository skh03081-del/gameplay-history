<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JYLEE JAE-YOUNG // GAMEPLAY ARCHIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0d1117;
            --card-bg: #161b22;
            --text-main: #e6edf3;
            --text-sub: #8b949e;
            --pc-accent: #58a6ff;     /* PC: 블루 */
            --mobile-accent: #3fb950;  /* 모바일: 그린 */
            --console-accent: #bc8cff; /* 콘솔: 퍼플 */
            --border-color: #30363d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            line-height: 1.6;
            padding: 80px 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        /* [Header] 이름과 타이틀 강조 */
        header {
            text-align: center;
            margin-bottom: 120px;
            padding-bottom: 60px;
            border-bottom: 1px solid var(--border-color);
        }
        header .name-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--pc-accent);
            letter-spacing: 8px;
            margin-bottom: 20px;
            display: block;
            font-weight: 700;
        }
        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4.2rem;
            font-weight: 700;
            letter-spacing: -2px;
            color: #fff;
            margin-bottom: 20px;
        }
        header p {
            font-size: 1.4rem;
            color: var(--text-sub);
            font-weight: 400;
            letter-spacing: 1px;
        }

        /* 섹션 레이블 */
        .section-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            margin: 120px 0 40px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, currentColor, transparent);
        }

        .pc-label { color: var(--pc-accent); }
        .mobile-label { color: var(--mobile-accent); }
        .console-label { color: var(--console-accent); }

        /* 그리드 */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
        }

        /* 카드 디자인 */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: currentColor;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* [Image Box] 사진 짤림 방지 + 위아래 블러 처리 */
        .img-box {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 배경에 깔리는 블러 이미지 (공간 채우기용) */
        .img-bg-blur {
            position: absolute;
            width: 110%;
            height: 110%;
            object-fit: cover;
            filter: blur(15px) brightness(0.4);
            z-index: 1;
        }

        /* 실제로 보여지는 메인 이미지 (contain으로 설정하여 짤림 방지) */
        .img-main {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            object-fit: contain; 
            padding: 5px; /* 미세한 여백으로 더 깔끔하게 */
        }

        /* 상하단 동일한 간격의 소프트 그라데이션 */
        .img-box::before, .img-box::after {
            content: '';
            position: absolute;
            left: 0; right: 0; height: 30%;
            z-index: 3;
            pointer-events: none;
        }
        .img-box::before { top: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent); }
        .img-box::after { bottom: 0; background: linear-gradient(to top, rgba(0,0,0,0.5), transparent); }

        .info-box {
            padding: 22px;
            background: var(--card-bg);
        }

        .info-box h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .time-badge {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.08);
            padding: 3px 10px;
            border-radius: 4px;
            color: var(--text-main);
        }

        .genre-text {
            font-size: 0.95rem;
            font-weight: 700;
            color: currentColor; /* 섹션 강조색 상속 */
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media (max-width: 1200px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; header h1 { font-size: 2.5rem; } } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <span class="name-tag">LEE JAE-YOUNG // GAME PLANNER</span>
        <h1>JYLEE <span style="color:var(--pc-accent)">GAME_LOG</span></h1>
        <p>48종의 게임 플레이 이력을 기반으로 한 장르별 분석 데이터베이스</p>
    </header>

    <div class="section-label pc-label">01. PC_PLATFORM</div>
    <div id="pc-grid" class="grid"></div>

    <div class="section-label mobile-label">02. MOBILE_ENVIRONMENT</div>
    <div id="mobile-grid" class="grid"></div>

    <div class="section-label console-label">03. CONSOLE_SYSTEM</div>
    <div id="console-grid" class="grid"></div>
</div>

<script>
    const parseTime = (t) => t.includes('년') ? parseInt(t) * 12 : parseInt(t);

    const render = (id, data, color) => {
        const grid = document.getElementById(id);
        const sorted = [...data].sort((a, b) => parseTime(b.time) - parseTime(a.time));
        
        sorted.forEach(g => {
            grid.innerHTML += `
                <div class="card" style="color: ${color}">
                    <div class="img-box">
                        <img src="${g.img}.jpg" class="img-bg-blur">
                        <img src="${g.img}.jpg" class="img-main" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300/111/333?text=IMAGE+MISSING';">
                    </div>
                    <div class="info-box">
                        <h3>${g.name}</h3>
                        <div class="stats">
                            <span class="time-badge">${g.time}</span>
                            <span class="genre-text">${g.genre}</span>
                        </div>
                    </div>

        });
    };

    document.addEventListener('DOMContentLoaded', () => {

</body>
</html>
