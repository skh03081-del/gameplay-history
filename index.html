<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JYLEE GAME_LOG ARCHIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a0c10;
            --card-bg: #161b22;
            --text-main: #e6edf3;
            --text-sub: #8b949e;
            /* 눈이 편한 부드러운 강조색 */
            --pc-accent: #79c0ff;     /* 연한 블루 */
            --mobile-accent: #7ee787;  /* 연한 그린 */
            --console-accent: #d2a8ff; /* 연한 퍼플 */
            --border-soft: rgba(48, 54, 61, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            line-height: 1.6;
            padding: 60px 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        /* 헤더 디자인 강화 */
        header {
            text-align: center;
            margin-bottom: 100px;
            padding: 40px 0;
            border-bottom: 1px solid var(--border-soft);
        }
        header .name-tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: var(--pc-accent);
            letter-spacing: 5px;
            margin-bottom: 10px;
            display: block;
        }
        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(180deg, #fff 0%, var(--text-sub) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }
        header p {
            font-size: 1.3rem;
            color: var(--text-sub);
            font-weight: 400;
        }

        /* 섹션 레이블 */
        .section-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            margin: 100px 0 40px;
            padding-left: 15px;
            border-left: 6px solid currentColor;
            display: flex;
            align-items: center;
        }

        .pc-label { color: var(--pc-accent); }
        .mobile-label { color: var(--mobile-accent); }
        .console-label { color: var(--console-accent); }

        /* 그리드 */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
        }

        /* 카드 디자인 개선 */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-soft);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: currentColor;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        /* 이미지 컨테이너 (블러 처리 및 전체 노출) */
        .img-box {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 배경 블러 효과 (사진이 잘리지 않게 함) */
        .img-bg-blur {
            position: absolute;
            width: 120%;
            height: 120%;
            object-fit: cover;
            filter: blur(20px) brightness(0.4);
            z-index: 1;
        }

        /* 실제 게임 이미지 */
        .img-main {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            object-fit: contain; /* 사진 전체를 다 보여줌 */
            transition: transform 0.5s;
        }

        /* 부드러운 외곽 페이드 처리 */
        .img-box::after {
            content: '';
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 40px 10px rgba(0,0,0,0.7);
            z-index: 3;
            pointer-events: none;
        }

        .info-box {
            padding: 25px;
            background: linear-gradient(180deg, rgba(22,27,34,0) 0%, rgba(22,27,34,1) 20%);
        }

        .info-box h3 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
            color: var(--text-sub);
        }

        .stats .time {
            color: currentColor;
            font-weight: 700;
            background: rgba(255,255,255,0.05);
            padding: 2px 10px;
            border-radius: 6px;
        }

        @media (max-width: 1200px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { 
            .grid { grid-template-columns: 1fr; }
            header h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <span class="name-tag">JYLEE JAE-YOUNG</span>
        <h1>GAMEPLAY ARCHIVE</h1>
        <p>기획자의 시선으로 기록한 48종의 게임 플레이 이력</p>
    </header>

    <div class="section-label pc-label">PC_PLATFORM</div>
    <div id="pc-grid" class="grid"></div>

    <div class="section-label mobile-label">MOBILE_ENVIRONMENT</div>
    <div id="mobile-grid" class="grid"></div>

    <div class="section-label console-label">CONSOLE_SYSTEM</div>
    <div id="console-grid" class="grid"></div>
</div>

<script>
    const parseTime = (t) => t.includes('년') ? parseInt(t) * 12 : parseInt(t);

    const render = (id, data, color) => {
        const grid = document.getElementById(id);
        const sorted = [...data].sort((a, b) => parseTime(b.time) - parseTime(a.time));
        
        sorted.forEach(g => {
            grid.innerHTML += `
                <div class="card" style="color: ${color}">
                    <div class="img-box">
                        <img src="${g.img}.jpg" class="img-bg-blur">
                        <img src="${g.img}.jpg" class="img-main" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300/111/555?text=IMAGE+MISSING';">
                    </div>
                    <div class="info-box">
                        <h3>${g.name}</h3>
                        <div class="stats">
                            <span class="time">${g.time}</span>
                            <span>EXPERIENCED</span>
                        </div>
                    </div>
                </div>`;
        });
    };

    const pcGames = [
        {name: "FC 온라인", time: "15년", img: "fc-online"},
        {name: "스타크래프트", time: "12년", img: "starcraft"},
        {name: "리그 오브 레전드", time: "10년", img: "lol"},
        {name: "오버워치", time: "8년", img: "overwatch"},
        {name: "메이플스토리", time: "8년", img: "maple"},
        {name: "배틀그라운드", time: "7년", img: "pubg"},
        {name: "서든어택", time: "5년", img: "sudden"},
        {name: "카운터 스트라이크", time: "5년", img: "cs"},
        {name: "카트라이더", time: "5년", img: "kart"},
        {name: "크레이지아케이드", time: "5년", img: "crazy-arcade"},
        {name: "로스트아크", time: "3년", img: "lostark"},
        {name: "워록", time: "3년", img: "warrock"},
        {name: "마구마구", time: "3년", img: "magu"},
        {name: "메이플스토리2", time: "2년", img: "maple2"},
        {name: "에이펙스 레전드", time: "1년", img: "apex"},
        {name: "철권 8", time: "1년", img: "tekken8"},
        {name: "어몽어스", time: "1년", img: "among-us"},
        {name: "구스구스덕", time: "1년", img: "goose-duck"},
        {name: "크로스파이어", time: "1년", img: "crossfire"},
        {name: "아이온2", time: "6개월", img: "aion2"}
    ];

    const mobileGames = [
        {name: "컴투스프로야구", time: "8년", img: "com2us"},
        {name: "전략적 팀 전투", time: "5년", img: "tft"},
        {name: "쿠키런", time: "5년", img: "cookierun"},
        {name: "미니게임천국", time: "3년", img: "minigame"},
        {name: "PES (eFootball)", time: "3년", img: "pes"},
        {name: "모두의 마블", time: "2년", img: "modoo-marble"},
        {name: "템플런", time: "2년", img: "temple-run"},
        {name: "리듬 스타", time: "2년", img: "rhythm-star"},
        {name: "프렌즈 사천성", time: "2년", img: "sachunsung"},
        {name: "브레인 아웃", time: "1년", img: "brainout"},
        {name: "MLB 라이벌", time: "1년", img: "mlb-rival"},
        {name: "앵그리버드", time: "1년", img: "angry-birds"},
        {name: "니케", time: "6개월", img: "nikke"},
        {name: "메이플 키우기", time: "6개월", img: "maple-raise"},
        {name: "하스스톤", time: "3개월", img: "hearthstone"},
        {name: "블루아카이브", time: "3개월", img: "blue-archive"}
    ];

    const consoleGames = [
        {name: "FIFA 시리즈", time: "10년", img: "fifa"},
        {name: "풋볼 매니저", time: "8년", img: "fm"},
        {name: "나루토 질풍전", time: "2년", img: "naruto"},
        {name: "MLB The Show", time: "1년", img: "mlb-show"},
        {name: "잇 테이크 투", time: "1년", img: "ittakestwo"},
        {name: "원피스 버닝 블러드", time: "1년", img: "onepiece"},
        {name: "아크 레이더스", time: "6개월", img: "arc-raiders"},
        {name: "퍼스트 디센던트", time: "6개월", img: "first-descendant"},
        {name: "엘든 링", time: "3개월", img: "elden-ring"},

        {name: "젤다의 전설", time: "3개월", img: "zelda"},
        {name: "인피니도트2", time: "3개월", img: "infinitode2"}
    ];

    document.addEventListener('DOMContentLoaded', () => {
        render('pc-grid', pcGames, "var(--pc-accent)");
        render('mobile-grid', mobileGames, "var(--mobile-accent)");
        render('console-grid', consoleGames, "var(--console-accent)");
    });
</script>
</body>
</html>
