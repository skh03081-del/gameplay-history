<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEE JAE YOUNG // GAME PLAY LIST</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 포트폴리오 다크 모드 표준 스타일 */
        :root {
            --bg-deep: #0a0c10;
            --card-bg: #1c2128;
            --text-main: #e6edf3;
            --text-sub: #8b949e;
            --accent-cyan: #58a6ff;  /* 전문적인 시안색 */
            --border-color: #30363d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            line-height: 1.6;
            padding: 80px 20px;
            min-height: 100vh;
        }

        .container { max-width: 1300px; margin: 0 auto; }

        /* 헤더 디자인 (요청하신 대로 단순화) */
        header {
            text-align: center;
            margin-bottom: 100px;
            padding-bottom: 40px;
            border-bottom: 1px solid var(--border-color);
        }
        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -1px;
            margin-bottom: 10px;
        }
        header .name-tag {
            font-size: 1.2rem;
            color: var(--text-sub);
            letter-spacing: 5px;
            font-weight: 400;
        }

        /* 플랫폼 섹션 제목 (PLATFORM 등 제거) */
        .section-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: var(--accent-cyan);
            margin: 80px 0 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border-color), transparent);
        }

        /* 그리드 */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        /* 카드 디자인 */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-cyan);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* [핵심] 사진 안 짤리고 전체 노출되게 디자인 수정 */
        .img-box {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3; /* 카드 비율 고정 */
            background: #000; /* 빈 공간 배경색 */
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 메인 이미지 (전체 노출) */
        .img-main {
            position: relative;
            z-index: 2;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* [중요] 절대 잘리지 않고 전체 다 보여줌 (개발 표준) */
            transition: transform 0.3s ease;
        }
        .card:hover .img-main { transform: scale(1.05); }

        /* 정보 영역 */
        .info-box {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .info-box h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 플레이 기간 대괄호 표시 */
        .time {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        /* 장르 데이터 노출 */
        .genre {
            font-size: 0.85rem;
            color: var(--accent-cyan);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @media (max-width: 1024px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; header h1 { font-size: 2.2rem; } } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>LEE JAE YOUNG // GAME PLAY LIST</h1>
        <p class="name-tag">DEVELOPER & PLANNER ARCHIVE</p>
    </header>

    <div class="section-label">01. PC</div>
    <div id="pc-grid" class="grid"></div>

    <div class="section-label">02. MOBILE</div>
    <div id="mobile-grid" class="grid"></div>

    <div class="section-label">03. CONSOLE</div>
    <div id="console-grid" class="grid"></div>
</div>

<script>
    const parseTime = (t) => t.includes('년') ? parseInt(t) * 12 : parseInt(t);

    const render = (id, data) => {
        const grid = document.getElementById(id);
        if (!grid) return;

        // 플레이 시간 많은 순서 정렬
        const sorted = [...data].sort((a, b) => parseTime(b.time) - parseTime(a.time));
        
        sorted.forEach(g => {
            grid.innerHTML += `
                <div class="card">
                    <div class="img-box">
                        <img src="${g.img}.jpg" alt="${g.name}" class="img-main" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300/111/333?text=IMAGE+MISSING';">
                    </div>
                    <div class="info-box">
                        <h3>${g.name}</h3>
                        <div class="stats">
                            <span class="time">[ ${g.time} ]</span>
                            <span class="genre">${g.genre}</span>
                        </div>
                    </div>
                </div>`;
        });
    };

    // [핵심] 'img' 값은 깃허브 최상위에 올린 파일명과 '반드시 대소문자까지' 똑같아야 합니다.

        {name: "마구마구", time: "3년", img: "magu", genre: "Sports"},
        {name: "메이플스토리2", time: "2년", img: "maple2", genre: "MMORPG"},
        {name: "에이펙스 레전드", time: "1년", img: "apex", genre: "FPS"},
        {name: "철권 8", time: "1년", img: "tekken8", genre: "Fighting"},
        {name: "어몽어스", time: "1년", img: "among-us", genre: "Social"},

    const mobileGames = [

        {name: "전략적 팀 전투", time: "5년", img: "tft", genre: "Auto Battler"},

    const consoleGames = [

    document.addEventListener('DOMContentLoaded', () => {
        render('pc-grid', pcGames);

</script>
</body>
</html>
